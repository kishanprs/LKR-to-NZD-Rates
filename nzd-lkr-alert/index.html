<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NZD → LKR Rate Watch</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --accent: #4ade80;
    --accent-warn: #fbbf24;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px;
    width: 360px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }
  .rate {
    font-size: 48px;
    font-weight: 700;
    margin: 8px 0 4px;
  }
  .unit { font-size: 16px; color: var(--muted); margin-bottom: 20px; }
  .status {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .status.above { background: rgba(74,222,128,0.15); color: var(--accent); }
  .status.below { background: rgba(251,191,36,0.15); color: var(--accent-warn); }
  .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .refresh {
    margin-top: 20px;
    background: none;
    border: 1px solid #2a2e3a;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>NZD → LKR</h1>
    <div class="rate" id="rate">--</div>
    <div class="unit">Sri Lankan Rupees per 1 NZD</div>
    <div class="status" id="status">Loading…</div>
    <div class="meta" id="meta">Fetching live rate…</div>
    <button class="refresh" onclick="loadRate()">Refresh</button>
  </div>

<script>
const THRESHOLD = 198;

async function loadRate() {
  const rateEl = document.getElementById('rate');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  rateEl.textContent = '--';
  statusEl.textContent = 'Loading…';
  metaEl.textContent = 'Fetching live rate…';

  try {
    const res = await fetch('https://open.er-api.com/v6/latest/NZD');
    const data = await res.json();
    const rate = data.rates.LKR;
    rateEl.textContent = rate.toFixed(2);

    if (rate >= THRESHOLD) {
      statusEl.textContent = `Above target (${THRESHOLD})`;
      statusEl.className = 'status above';
    } else {
      statusEl.textContent = `Below target (${THRESHOLD})`;
      statusEl.className = 'status below';
    }

    const updated = new Date(data.time_last_update_utc);
    metaEl.textContent = `Last updated: ${updated.toLocaleString()} · Source: open.er-api.com`;
  } catch (err) {
    statusEl.textContent = 'Error';
    statusEl.className = 'status below';
    metaEl.textContent = 'Could not load the live rate. Try refreshing.';
  }
}

loadRate();
</script>
</body>
</html>
